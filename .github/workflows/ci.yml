name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Engine and published site (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The engine has no third-party dependencies on purpose: a season must be
      # reproducible years from now without resolving a dependency tree.
      - name: Standard-library purity
        run: python scripts/check_purity.py

      - name: Test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Memory checksums and data audits
        run: python -m sim.cli verify

      # The audit imports nothing from sim/: it re-derives the official book from
      # the Treasury's tape files and the run's streams with its own arithmetic,
      # which is the only way a mistake shared by the engine and its own
      # verification becomes visible. It writes its report into the committed
      # memory, and the diff below fails the job if a fresh audit disagrees with
      # the report the README quotes - so the published check count is a
      # re-derived number rather than a sentence somebody typed.
      - name: Independent audit of the official auction book
        run: |
          python scripts/independent_audit_official.py --json memory/official/ledger/independent_audit.json
          if ! git diff --exit-code --stat -- memory/official/ledger/independent_audit.json; then
            echo "::error::the committed independent-audit report is stale - commit the fresh one"
            exit 1
          fi

      # The three official FRED series retrieved with the page-fetch tool were
      # transcribed by hand, which is the one place a wrong digit could have
      # entered the repository. This checks them structurally, against the
      # trading calendar of a runner-collected file, and against two values the
      # Federal Reserve Bank of New York published independently.
      - name: Verify the in-session official extracts
        run: python scripts/verify_official_extracts.py

      - name: Irregularity register renders
        run: python -m sim.cli irregularities

      - name: Source register renders
        run: python -m sim.cli sources

      - name: Leaderboard renders
        run: python -m sim.cli leaderboard

      # The published numbers are re-derived from the raw event trail by code
      # that never imports the engine, so a bug shared by the engine and its own
      # test suite cannot hide. Run against the committed memory, because that is
      # what the site shows.
      - name: Independent audit of the published season
        run: python scripts/independent_audit.py

      # Season 2 is the research run the official-price gate refuses, and it has
      # its own auditor. It was written but never wired into CI, and the cost of
      # that showed up later: the forward collector appended two sessions to the
      # price files and the auditor's custody checks had been failing, invisibly,
      # ever since. The audit now passes because each change is chained to the
      # bytes a run recorded; without this step the next unexplained rewrite
      # would go unnoticed again.
      - name: Independent audit of the published Season 2 run
        run: python scripts/independent_audit_season2.py

  site-is-not-stale:
    name: Published site matches the code and the run memory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # docs/ is committed and served by GitHub Pages, so a code change that is
      # not followed by a rebuild would silently publish stale numbers. This
      # rebuilds from the committed run memory and diffs the whole tree.
      - name: Rebuild the site from memory
        run: python -m sim.cli build-site --out /tmp/rebuilt

      - name: Diff the rebuild against docs/
        run: |
          if diff -r docs /tmp/rebuilt; then
            echo "OK: docs/ is byte-identical to a fresh rebuild"
          else
            echo "::error::docs/ is stale - run 'python -m sim.cli build-site' and commit the result"
            exit 1
          fi

      # A fresh season must reproduce the committed leaderboard exactly. This is
      # the determinism guarantee the whole memory store rests on.
      - name: Re-run the primary season into a scratch memory root
        run: |
          python -m sim.cli --memory-root /tmp/scratch-memory run --seeds 20260917
          python - <<'PY'
          import json
          committed = json.load(open("memory/runs/season1-primary-seed20260917/leaderboard.json"))
          rebuilt = json.load(open("/tmp/scratch-memory/runs/season1-primary-seed20260917/leaderboard.json"))
          if committed != rebuilt:
              raise SystemExit("leaderboard is not reproducible from the same seed and config")
          print("OK: leaderboard reproduced bit-for-bit from seed 20260917")
          PY

      # And the freshly generated season must independently audit too: this is
      # the check that catches code which reproduces itself but disagrees with
      # its own accounting, which no unit test necessarily does.
      - name: Independent audit of the re-run season
        run: python scripts/independent_audit.py --memory-root /tmp/scratch-memory
