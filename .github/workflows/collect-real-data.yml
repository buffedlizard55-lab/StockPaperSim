name: Collect real market data

# WHY THIS RUNS ON A GITHUB RUNNER AND NOT IN DEVELOPMENT
# -------------------------------------------------------
# The project's development sandbox has no outbound HTTPS, and the simulation is
# only allowed to trade on real, citable prices. This workflow does the fetching
# on a runner that does have a network, writes everything verbatim under
# data/real/ with a SHA-256 per file plus a per-request manifest, and commits the
# result back to the branch it was dispatched from, so every row the site shows
# can be re-derived from a file in this repository.
#
# It is manual-only on purpose: scheduled data collection would let the
# repository change without a human reading the diff.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated sections (prices,sec,fda,sports,weather,kalshi)"
        required: false
        default: "prices,sec,fda,sports,weather,kalshi"
      max_seconds:
        description: "Soft budget for the whole collection run"
        required: false
        default: "1500"
      commit:
        description: "Commit the collected data back to this branch"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write

concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    name: Fetch official and secondary sources
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Standard-library purity (the collector must stay stdlib-only)
        run: python scripts/check_purity.py

      - name: Collect
        run: |
          python scripts/collect_real_data.py \
            --out data/real \
            --only "${{ github.event.inputs.only }}" \
            --max-seconds "${{ github.event.inputs.max_seconds }}"

      - name: Summarise the collection manifest
        run: |
          python - <<'PY'
          import json, collections
          m = json.load(open("data/real/collection_manifest.json"))
          print(f"requests: {len(m['requests'])}  ok: {m['ok']}  failed: {m['failed']}  "
                f"budget_exhausted: {m['budget_exhausted']}")
          by_kind = collections.Counter(
              (r["kind"], "ok" if r["ok"] else "FAIL") for r in m["requests"])
          for key, count in sorted(by_kind.items()):
              print(f"  {key[0]:8s} {key[1]:5s} {count}")
          failures = [r for r in m["requests"] if not r["ok"]]
          for r in failures[:25]:
              print(f"  FAIL {r['kind']:8s} {r.get('error','')[:60]:62s} {r['url'][:110]}")
          c = json.load(open("data/real/coverage_report.json"))
          for s in c["sources"]:
              print(f"  {s['label']:46s} {s['files']:4d} files {s['bytes']/1024:9.1f} KB")
          PY

      - name: Cross-check summary
        run: |
          python - <<'PY'
          import json, os
          p = "data/real/crosschecks/price_crosscheck.json"
          if not os.path.exists(p):
              print("no cross-check produced")
              raise SystemExit(0)
          for pair in json.load(open(p))["pairs"]:
              keys = {k: v for k, v in pair.items()
                      if k in ("kind", "symbol", "n", "return_correlation",
                               "max_abs_level_diff", "max_abs_diff_bps",
                               "median_abs_diff_bps", "max_abs_daily_return_diff")}
              print(keys)
          PY

      - name: Show what changed
        run: git status --short data/real | head -40; du -sh data/real

      - name: Commit the collected data back to this branch
        if: ${{ github.event.inputs.commit == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/real
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "data: collect real market and event data from official sources

          Collected by scripts/collect_real_data.py on a GitHub runner because the
          development sandbox has no outbound network. Every request, status, byte
          count and SHA-256 is recorded in data/real/collection_manifest.json."
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload the collection manifest as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-manifest
          path: |
            data/real/collection_manifest.json
            data/real/coverage_report.json
            data/real/crosschecks/
          if-no-files-found: warn
          retention-days: 14
