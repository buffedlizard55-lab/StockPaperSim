<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockPaperSim</title>
<meta name="description" content="StockPaperSim: a one-year paper-trading stock competition between 20 return-seeking strategies, simulated on a replay of the real S&amp;P 500 and VIX path, with full execution-cost modelling and a complete audit trail.">
<!--
  The site itself lives in /docs and is generated by scripts/build_site.py from
  the run memory. This file exists only because GitHub Pages for this repository
  is configured to publish the root of the main branch rather than /docs, and
  changing that setting needs repository admin rights.

  It is a redirect, not a copy: every page, stylesheet and JSON file is served
  from under docs/, so there is nothing here that can go stale. If the Pages
  source is ever switched to /docs, this file simply stops being the entry point
  and the canonical URL keeps working.

  CI checks that docs/ is byte-identical to a fresh build (.github/workflows/
  ci.yml); this file is deliberately outside that generated tree.
-->
<meta http-equiv="refresh" content="0; url=docs/index.html">
<link rel="canonical" href="docs/index.html">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
         Helvetica, Arial, sans-serif; background: #0d1117; color: #e6edf3; }
  main { max-width: 34rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; letter-spacing: -.01em; }
  p { margin: 0 0 1.25rem; color: #9198a1; }
  a { display: inline-block; padding: .6rem 1.1rem; border-radius: 8px;
      background: #1f6feb; color: #fff; text-decoration: none; font-weight: 600; }
  a:hover { background: #388bfd; }
  code { color: #9198a1; font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>StockPaperSim</h1>
  <p>Alpha Cup &middot; Season 1 &middot; 2025-09-17 &rarr; 2026-09-16</p>
  <p><a href="docs/index.html">Go to the competition site</a></p>
  <p><code>docs/index.html</code></p>
</main>
</body>
</html>
